<!DOCTYPE html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MebeliX</title>
    <link rel="icon" type="image/png" href="/assets/images/favicon.png" />
    <!-- O'rnatiladigan ilova (manifest) — service worker YO'Q, ataylab: skan
         serverdagi tranzaksiya, oflayn kesh terminalni adashtiradi; yangilanish
         index.html no-cache + hash'li assetlar + kiosk ETag tekshiruvi bilan.
         O'rnatilgan holda display-mode: fullscreen — terminal overlay'i chiqmaydi. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#16233a" />
    <!-- iOS Safari manifest ikonkalarini O'QIMAYDI — faqat shu tegni. 180 px,
         shaffofsiz to'liq kvadrat: iOS burchakni o'zi yumaloqlaydi, shaffof
         joyni QORA qiladi (2026-09-04 da haqiqiy iPhone'da ko'rildi). -->
    <link rel="apple-touch-icon" href="./src/icons/apple-touch-icon.png" />
    <!-- iOS `display: fullscreen` ni ham manifestdan olmaydi — busiz «Home
         Screen»ga qo'shilgan ilova Safari manzil qatori bilan ochiladi. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MebeliX" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
