server {
  listen 80;
  server_name _;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

  # index.html hech qachon keshlanmasin — aks holda deploy'dan keyin eski hash'li assetlarga ishora qilib oq ekran beradi
  location = /index.html {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-cache";
  }

  # PWA manifest: hash'siz nom, shuning uchun index.html kabi no-cache; MIME
  # application/manifest+json — nginx default mime.types'da yo'q, shusiz Chrome
  # manifestni rad etadi va "o'rnatish" taklifi chiqmaydi.
  location = /manifest.webmanifest {
    root /usr/share/nginx/html;
    types { application/manifest+json webmanifest; }
    add_header Cache-Control "no-cache";
  }

  # Yig'uvchi uchun ochiq 3D sahifa: manzilning o'zida token bor. API javoblari
  # (`public.py`) bilan bir xil sarlavhalar — sahifa indekslanmasin va boshqa
  # saytga o'tilganda token Referer bilan tarqalmasin.
  location ^~ /3d/ {
    root /usr/share/nginx/html;
    try_files /index.html =404;
    add_header Cache-Control "no-cache";
    add_header X-Robots-Tag "noindex, nofollow";
    add_header Referrer-Policy "no-referrer";
  }

  location / {
    root /usr/share/nginx/html;
    index index.html index.htm;
    # Oxirgi parametr URI (=404 emas) — nginx ichki redirect qiladi, shuning uchun
    # chuqur havola (/orders/123) ham `location = /index.html` no-cache blokidan o'tadi
    try_files $uri $uri/ /index.html;

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
      expires 1y;
      add_header Cache-Control "public, immutable";
    }
  }

  # Backend yo'llarini reverse proxy (caddy/Caddyfile) beradi, bu konteyner emas.
  # SPA fallback'ka tushib 200 + index.html qaytarmasin — xato ekani aniq bilinsin.
  location ~ ^/(api|docs|redoc|openapi\.json) {
    return 404;
  }
}
