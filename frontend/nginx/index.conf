server {
  listen 80;
  server_name _;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

  # index.html hech qachon keshlanmasin — aks holda deploy'dan keyin eski hash'li assetlarga ishora qilib oq ekran beradi
  location = /index.html {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-cache";
  }

  location / {
    root /usr/share/nginx/html;
    index index.html index.htm;
    try_files $uri $uri/ /index.html =404;

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
      expires 1y;
      add_header Cache-Control "public, immutable";
    }
  }

  # Backend yo'llarini reverse proxy (caddy/Caddyfile) beradi, bu konteyner emas.
  # SPA fallback'ka tushib 200 + index.html qaytarmasin — xato ekani aniq bilinsin.
  location ~ ^/(api|docs|redoc|openapi\.json) {
    return 404;
  }
}
