repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: check-toml
      - id: check-yaml
        args:
          - --unsafe

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # backend/uv.lock dagi ruff bilan bir xil versiya (ruff-pre-commit teglari ruff relizlarini aks ettiradi)
    rev: v0.16.3
    # Faqat `backend/` — CI ham shu qamrovni tekshiradi (ci.yml: `cd backend`).
    # Busiz hook `bridge-agent/agent.py` ni ham oladi, lekin u yerda ruff konfigi
    # yo'q: DEFAULT line-length 88 bilan CI hech qachon tekshirmaydigan uslubga
    # qayta yozilardi. `docs/*.md` ham chetda qoladi — ruff 0.16 markdown ichidagi
    # python bloklarini formatlaydi, ular esa qo'lda tekislangan.
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: local
    hooks:
      # mypy needs the project's installed environment (it imports app modules), so it stays as a
      # local hook. `make install` (uv sync) is a setup prerequisite — already part of `make setup`.
      - id: mypy
        name: mypy
        entry: uv --directory backend run mypy app
        language: system
        types: [python]
        pass_filenames: false

      # biome runs from `frontend/` so it picks up `biome.json`. `npm install` is a setup prereq.
      - id: biome-check
        name: biome check (frontend)
        entry: bash -c 'cd frontend && npx --no-install biome check --no-errors-on-unmatched --files-ignore-unknown=true ./'
        language: system
        files: ^frontend/.*\.(ts|tsx|js|jsx|json|css)$
        pass_filenames: false
