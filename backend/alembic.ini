[alembic]
script_location = app/migrations
prepend_sys_path = .
version_path_separator = os
# sqlalchemy.url — env.py `set_main_option` bilan .env'dan quriladi, shuning uchun bu yerda yo'q

# Autogenerate qilingan fayl darhol ruff bilan tuzatiladi va formatlanadi,
# aks holda CI lint darvozasi (`ruff check --no-fix`) qizil beradi.
[post_write_hooks]
hooks = ruff_check,ruff_format
ruff_check.type = exec
ruff_check.executable = ruff
ruff_check.options = check --fix REVISION_SCRIPT_FILENAME
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
