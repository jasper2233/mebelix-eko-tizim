[project]
name = "mebelix-backend"
version = "0.1.0"
description = "MebeliX backend"
authors = [{ name = "MebeliX", email = "imkonwork@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11, <3.14"
dependencies = [
    "pydantic[email]>=2.6.1",
    "fastapi>=0.136.1",
    "uvicorn>=0.46.0",
    # WebSocket transporti: uvicorn [standard] extra'siz o'rnatilgan (click + h11),
    # wsproto ham yo'q — /ws/events va /ws/bridge aynan shu paketga tayanadi
    "websockets>=16.0",
    "uvloop>=0.22.1; sys_platform != 'win32'",
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    # `[crypto]` extra'siz: ALGORITHM=HS256 (simmetrik), pyjwt uni o'z hashlib'i
    # bilan imzolaydi — `cryptography` faqat RS*/ES* uchun kerak bo'lardi.
    "pyjwt>=2.8.0",
    "SQLAlchemy>=2.0.25",
    "python-multipart>=0.0.26",
    "greenlet>=3.4.0",
    "pydantic-settings>=2.14.0",
    "redis>=5.0.1",
    "arq>=0.28.0",
    "bcrypt>=4.1.1",
    "gunicorn>=23.0.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "openpyxl>=3.1.5",
    "tzdata>=2026.2",
    "pillow>=12.3.0",
    "qrcode>=8.2",
]

[dependency-groups]
dev = [
    "mypy>=1.20.2",
    "ruff>=0.15.12",
    "pre-commit>=4.6.0",
    "types-openpyxl>=3.1.5.20260518",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["app/"]

[tool.hatch.build.targets.wheel]
include = ["app/"]
packages = ["app"]

[tool.ruff]
target-version = "py311"
line-length = 120
fix = true

[tool.ruff.lint]
select = [
    # https://docs.astral.sh/ruff/rules/#pyflakes-f
    "F", # Pyflakes
    # https://docs.astral.sh/ruff/rules/#pycodestyle-e-w
    "E", # pycodestyle
    "W", # Warning
    # https://docs.astral.sh/ruff/rules/#flake8-comprehensions-c4
    # https://docs.astral.sh/ruff/rules/#mccabe-c90
    "C", # Complexity (mccabe+) & comprehensions
    # https://docs.astral.sh/ruff/rules/#pyupgrade-up
    "UP", # pyupgrade
    # https://docs.astral.sh/ruff/rules/#isort-i
    "I", # isort
]
ignore = [
    # https://docs.astral.sh/ruff/rules/#pycodestyle-e-w
    "E402", # module level import not at top of file
    # https://docs.astral.sh/ruff/rules/#pyupgrade-up
    "UP006", # use-pep585-annotation
    "UP007", # use-pep604-annotation
    "E741",  # Ambiguous variable name
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
    "F401", # unused import
    "F403", # star imports
]

[tool.ruff.lint.mccabe]
max-complexity = 24

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
mypy_path = "."
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "app.*"
disallow_untyped_defs = true
