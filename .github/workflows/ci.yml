name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: uv --project backend sync --all-groups
      - name: Lint (ruff)
        run: cd backend && uv run ruff check app && uv run ruff format --check app
      - name: Types (mypy)
        run: cd backend && uv run mypy app
      - name: Tests (giblab parser)
        run: cd backend && uv run python -m tests.test_giblab

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint (biome)
        run: npx biome ci .
      - name: Build (tsc + vite)
        run: npm run build
