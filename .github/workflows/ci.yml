name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      # `alembic check` uchun — u modelni JONLI sxema bilan solishtiradi.
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install
        run: uv --project backend sync --all-groups
      - name: Lint (ruff)
        # `--no-fix` SHART: pyproject.toml da `fix = true` turibdi, ya'ni oddiy
        # `ruff check app` xatoni jimgina TUZATIB exit 0 qaytaradi — CI hech qachon
        # qizil bo'lmaydi. Avtomatik tuzatish faqat pre-commit va `make format` da.
        run: cd backend && uv run ruff check --no-fix app && uv run ruff format --check app
      - name: Types (mypy)
        run: cd backend && uv run mypy app
      - name: Modul chegarasi (EKO TIZIM)
        # app.modules.<m> ga tashqaridan faqat .service orqali (backend/app/modules/__init__.py)
        run: python3 scripts/check_module_boundaries.py
      - name: Brend aktivlari (design/logo/ bilan mos)
        # Logo/ikonka nusxalari QO'LDA tahrirlanmaydi — `scripts/brand-assets.py` ularni
        # design/logo/ dan yasaydi. Qo'lda ko'chirilganda masterdan jimgina ajralardi
        # (chek logotipi 16% siqilib qolgan edi) — sabab skriptning o'zida.
        run: cd backend && uv run python ../scripts/brand-assets.py --check
      - name: Migratsiya drifti (alembic check)
        # Toza bazaga BUTUN zanjirni qo'llaydi (ya'ni "prodda ishlagan, toza bazada
        # yiqiladigan" migratsiya shu yerda tutiladi), keyin modelni natija sxema
        # bilan solishtiradi. Modelga ustun qo'shib migratsiya yozilmasa — CI qizil.
        # Ataylab qoldirilgan yetim jadval/ustunlar `migrations/env.py` dagi
        # LEGACY_TABLES / LEGACY_COLUMNS da sanab o'tilgan.
        env:
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        run: cd backend && uv run alembic upgrade head && uv run alembic check
      - name: Caddyfile validate
        # Caddyfile prodga rsync bilan boradi va `deploy.sh` uni `caddy reload`
        # bilan qo'llaydi. Reload buzuq konfigni RAD ETADI (sayt tirik qoladi),
        # lekin unda deploy yarim yo'lda yiqiladi — sintaksisni shu yerda,
        # deploydan OLDIN tutgan arzonroq.
        run: |
          docker run --rm -v "$PWD/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -e SITE_ADDRESS=:80 caddy:2-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint (biome)
        run: npx biome ci .
      - name: Build (tsc + vite)
        run: npm run build

  images:
    # Image'lar shu yerda quriladi va ghcr.io ga yuboriladi. Prod serveri 1 vCPU /
    # 2 GB — u yerda build qilish saytni sekinlashtirardi va CI qilgan ishni
    # takrorlardi. Server endi faqat tayyor image'ni tortadi.
    # Lint bilan PARALLEL yuradi (deploy baribir ikkalasini kutadi) — ketma-ket
    # kutish har deployga 1-2 daqiqa qo'shardi; lint yiqilsa deploy skip bo'ladi,
    # ortiqcha image esa delete-package-versions bilan baribir tozalanadi.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: backend
            context: .
            dockerfile: ./backend/Dockerfile
            build_args: ""
          # VITE_* build vaqtida bundle'ga kiradi — prod .env dagi qiymatlar bilan
          # bir xil bo'lishi shart (VITE_API_URL bo'sh = same-origin, Caddy orqali).
          - name: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
            build_args: |
              VITE_API_URL=
              VITE_API_TIMEOUT_MS=30000
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          # Ikki teg bitta manifestga: `:<git sha>` rollback uchun (deploy.sh),
          # `:latest` esa compose'dagi `${TAG:-latest}` defaultini haqiqiy
          # image'ga bog'laydi — busiz TAG'siz `make docker-prod` manifest
          # unknown bilan yiqilardi. Job faqat main-push'da yuradi (yuqoridagi
          # `if`), ya'ni `:latest` doim main'ning oxirgi build'i.
          tags: |
            ghcr.io/${{ github.repository_owner }}/mebelix-mes-${{ matrix.name }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/mebelix-mes-${{ matrix.name }}:latest
          # source labeli paketni repoga bog'laydi — busiz deploy jobning
          # GITHUB_TOKEN'i paketni tortishga huquq olmaydi
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: ${{ matrix.build_args }}
          # Runner'lar orasida qatlam keshi — o'zgarmagan qatlam qayta qurilmaydi
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      # Har deploy ghcr'ga ~620 MB qo'yadi va eski versiyalar o'zi o'chmaydi —
      # private repo paket xotirasi cheklangan. Oxirgi 10 tasi qoladi: rollback
      # uchun yetarli (deploy.sh faqat bitta oldingi stable'ga qaytaradi).
      - uses: actions/delete-package-versions@v5
        continue-on-error: true # tozalash yiqilsa deploy to'xtamasin
        with:
          package-name: mebelix-mes-${{ matrix.name }}
          package-type: container
          min-versions-to-keep: 10
          delete-only-untagged-versions: false

  agent:
    # bridge-agent exe: windows-runner'da PyInstaller bilan quriladi, deploy uni
    # agent-dist/ ga qo'yadi — agent o'zi tortib yangilanadi (flashka tarixi
    # tugadi). images bilan PARALLEL: deploy baribir hammasini kutadi.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build exe
        run: |
          # pyinstaller QOTIRILGAN: 6.22 bootloader'i bola jarayonda ota exe'ni
          # tekshira boshladi va bat orqali qayta ishga tushgan agent yiqildi
          # (agent.py `_spawn_bat`). Versiya ko'tarilsa — onefile restart oqimi
          # tsex kompyuterida qayta sinaladi, shunchaki "latest" olinmaydi.
          # pyserial — andon: stanok signal ustunini o'qiydigan Pico USB porti (agent.py `start_andon`)
          pip install "websockets>=14" pywin32 pillow pynput pystray pyserial "pyinstaller==6.22.2"
          pyinstaller --onefile --noconsole --icon bridge-agent/mebelix.ico --name mebelix-agent bridge-agent/agent.py
      - name: Manifest (versiya + sha256)
        shell: python
        run: |
          import hashlib, json, re, pathlib
          src = pathlib.Path("bridge-agent/agent.py").read_text(encoding="utf-8")
          ver = re.search(r'AGENT_VERSION = "([^"]+)"', src).group(1)
          exe = pathlib.Path("dist/mebelix-agent.exe").read_bytes()
          pathlib.Path("dist/version.json").write_text(
              json.dumps({"version": ver, "sha256": hashlib.sha256(exe).hexdigest()})
          )
          print("agent", ver, len(exe), "bayt")
      - uses: actions/upload-artifact@v4
        with:
          name: agent-dist
          path: dist/
          retention-days: 7

  deploy:
    # main'ga push + CI yashil bo'lsa prodga chiqadi (mes.mebelix.uz)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, images, agent]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    concurrency:
      group: prod-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        # CI qurgan exe rsync bilan serverga boradi (agent-dist/), api konteyner
        # uni read-only mount qilib /latest va /download orqali beradi
        with:
          name: agent-dist
          path: agent-dist
      - name: SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
      - name: Sync code
        run: |
          # .stable_tag/.backup.env serverda yashaydi — --delete ularni o'chirsa
          # avto-rollback tayanchi va Telegram backup sozlamasi yo'qoladi
          rsync -az --delete \
            --exclude .git --exclude node_modules --exclude .venv \
            --exclude __pycache__ --exclude dist --exclude uploads \
            --exclude .env --exclude backups \
            --exclude .stable_tag --exclude .backup.env \
            ./ "root@${{ secrets.DEPLOY_HOST }}:/opt/mebelix-mes/"
      - name: Backup Telegram sozlamasi (serverda)
        # Kunlik backup (`scripts/backup.sh`) nusxani deploy xabarlari ketadigan
        # AYNAN SHU botga yuboradi — pastdagi `notify` job'i bilan bir xil sirlar.
        # Fayl serverda yashaydi (rsync uni ataylab chetlab o'tadi) va har deployda
        # shu yerdan yangilanadi, ya'ni tokenni qo'lda ko'chirish kerak emas.
        # Qiymatlar env orqali va ssh STDIN ga: serverdagi ham, runnerdagi ham
        # process ro'yxatiga tushmasin. `umask 077` -> fayl 600 bo'lib yaraladi.
        env:
          TG_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT_ID }}
          # Guruhda mavzular (topics) yoqilgan bo'lsa — xabar SHU mavzuga tushadi.
          # Bo'sh bo'lsa oddiy chatga ketadi, ya'ni eski sozlama buzilmaydi.
          TG_TOPIC: ${{ secrets.TG_TOPIC_ID }}
        run: |
          printf 'TG_BOT_TOKEN=%s\nTG_CHAT_ID=%s\nTG_TOPIC_ID=%s\n' "$TG_TOKEN" "$TG_CHAT" "$TG_TOPIC" |
            ssh "root@${{ secrets.DEPLOY_HOST }}" \
              "umask 077 && cat > /opt/mebelix-mes/.backup.env"

      - name: Registry login (serverda)
        # Paketlar private — server ghcr'dan tortish uchun autentifikatsiya qiladi.
        # Token stdin orqali uzatiladi (buyruq argumentida emas: serverdagi process
        # ro'yxatiga tushmasin) va faqat shu run davomida amal qiladi — doimiy PAT
        # server diskida saqlanmaydi.
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | ssh "root@${{ secrets.DEPLOY_HOST }}" \
            "docker login ghcr.io -u ${{ github.actor }} --password-stdin"
      - name: Deploy (smoke yiqilsa avto-rollback)
        run: |
          ssh "root@${{ secrets.DEPLOY_HOST }}" \
            "cd /opt/mebelix-mes && TAG=${{ github.sha }} REGISTRY=ghcr.io/${{ github.repository_owner }} bash scripts/deploy.sh"
      - name: Public smoke (nginx/TLS yo'li)
        run: |
          # `--max-time` SHART (`deploy.sh` dagi sabab bilan): TCP qabul qilib javob bermaydigan API da
          # usiz curl cheksiz kutadi va job `prod-deploy` navbatini 6 soatgacha band qiladi
          code=$(curl -s --connect-timeout 5 --max-time 15 -o /dev/null -w '%{http_code}' https://mes.mebelix.uz/api/v1/ready) || :
          [ "$code" = "200" ] || { echo "public ready: $code" >&2; exit 1; }
          curl -s --connect-timeout 5 --max-time 15 https://mes.mebelix.uz/api/v1/ready

  notify:
    # Alohida job: CI (backend/frontend) yiqilsa deploy skip bo'ladi —
    # notify deploy ichida bo'lsa xabar umuman ketmaydi. Bu yerda har doim ketadi.
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, images, agent, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Telegram notify
        env:
          # env orqali: commit message'dagi maxsus belgilar shell'ga tushmasin
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          BACKEND: ${{ needs.backend.result }}
          FRONTEND: ${{ needs.frontend.result }}
          IMAGES: ${{ needs.images.result }}
          AGENT: ${{ needs.agent.result }}
          DEPLOY: ${{ needs.deploy.result }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TG_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT_ID }}
          # Guruhda mavzular (topics) yoqilgan bo'lsa — xabar SHU mavzuga tushadi.
          # Bo'sh bo'lsa oddiy chatga ketadi, ya'ni eski sozlama buzilmaydi.
          TG_TOPIC: ${{ secrets.TG_TOPIC_ID }}
        run: |
          if [ "$DEPLOY" = "success" ]; then
            head="✅ MebeliX deploy OK"
          elif [ "$DEPLOY" = "skipped" ]; then
            head="❌ MebeliX CI YIQILDI (deploy boshlanmadi) — backend: $BACKEND, frontend: $FRONTEND, images: $IMAGES, agent: $AGENT"
          else
            head="❌ MebeliX deploy YIQILDI (avto-rollback ishlagan bo'lishi kerak)"
          fi
          msg="$head
          $(echo "$COMMIT_MSG" | head -1)
          ${GITHUB_SHA::7} · $RUN_URL"
          # Topic alohida argument. `if` SHART: `[ -n ... ] && x=y` bo'sh qiymatda
          # 1 qaytaradi va qadam `bash -e` ostida shu yerda yiqilardi.
          topic=""
          if [ -n "${TG_TOPIC:-}" ]; then topic="-d message_thread_id=${TG_TOPIC}"; fi
          curl -s --max-time 20 -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="$TG_CHAT" $topic --data-urlencode text="$msg" >/dev/null
