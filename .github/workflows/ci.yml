name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: uv --project backend sync --all-groups
      - name: Lint (ruff)
        run: cd backend && uv run ruff check app && uv run ruff format --check app
      - name: Types (mypy)
        run: cd backend && uv run mypy app
      - name: Tests (giblab parser)
        run: cd backend && uv run python -m tests.test_giblab

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint (biome)
        run: npx biome ci .
      - name: Build (tsc + vite)
        run: npm run build

  deploy:
    # main'ga push + CI yashil bo'lsa prodga chiqadi (mes.mebelix.uz)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    concurrency:
      group: prod-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
      - name: Sync code
        run: |
          rsync -az --delete \
            --exclude .git --exclude node_modules --exclude .venv \
            --exclude __pycache__ --exclude dist --exclude uploads \
            --exclude .env \
            ./ "root@${{ secrets.DEPLOY_HOST }}:/opt/mebelix-mes/"
      - name: Deploy (smoke yiqilsa avto-rollback)
        run: |
          ssh "root@${{ secrets.DEPLOY_HOST }}" \
            "cd /opt/mebelix-mes && TAG=${{ github.sha }} bash scripts/deploy.sh"
      - name: Public smoke (nginx/TLS yo'li)
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' https://mes.mebelix.uz/api/v1/ready)
          [ "$code" = "200" ] || { echo "public ready: $code" >&2; exit 1; }
          curl -s https://mes.mebelix.uz/api/v1/ready
