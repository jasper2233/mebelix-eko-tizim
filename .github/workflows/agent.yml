name: Bridge Agent

# bridge-agent o'zgarganda: Windows'da exe build qilib Telegram botga yuboradi —
# arrachi monoblokida Telegram'dan yuklab olib eski exe ustiga qo'yiladi (token .env o'zgarmaydi)
on:
  push:
    branches: [main]
    paths: [bridge-agent/**, .github/workflows/agent.yml]

jobs:
  build-and-send:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build exe
        shell: bash
        run: |
          pip install websockets pywin32 pillow pyinstaller
          pyinstaller --onefile --console --name mebelix-agent bridge-agent/agent.py
      - name: Send to Telegram
        shell: bash
        env:
          TG_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT_ID }}
        run: |
          ls -la dist/
          resp=$(curl -s -F chat_id="$TG_CHAT" \
            -F document=@dist/mebelix-agent.exe \
            -F caption="mebelix-agent yangi versiya (${GITHUB_SHA::7}) - monoblokda eski exe ustiga qo'ying" \
            "https://api.telegram.org/bot${TG_TOKEN}/sendDocument")
          # token javobda yo'q — faqat ok/error_code/description keladi
          echo "$resp" | head -c 400
          echo "$resp" | grep -q '"ok":true' || { echo "::error::Telegram sendDocument yiqildi"; exit 1; }
