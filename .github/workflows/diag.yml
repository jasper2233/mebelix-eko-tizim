# VAQTINCHA: prod Caddy konfigi holatini aniqlash uchun. Faqat O'QISH —
# hech narsa o'zgartirmaydi va deploy qilmaydi. Tekshiruv tugagach o'chiriladi.
name: diag

on: workflow_dispatch

jobs:
  caddy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
      - name: Caddy konfigi holati
        run: |
          ssh "root@${{ secrets.DEPLOY_HOST }}" bash -s <<'REMOTE'
          set -u
          cd /opt/mebelix-mes
          echo "=== 1) HOST fayl (rsync yetkazdimi) ==="
          grep -n -A3 'handle /metrics' caddy/Caddyfile || echo "  TOPILMADI"
          echo
          echo "=== 2) KONTEYNER ichida (mount yangimi) ==="
          docker compose -f docker-compose.prod.yml exec -T caddy \
            grep -n -A3 'handle /metrics' /etc/caddy/Caddyfile || echo "  TOPILMADI"
          echo
          echo "=== 3) private_ranges qoldig'i bormi (eski konfig belgisi) ==="
          grep -c 'private_ranges' caddy/Caddyfile || true
          docker compose -f docker-compose.prod.yml exec -T caddy \
            grep -c 'private_ranges' /etc/caddy/Caddyfile || true
          echo
          echo "=== 4) caddy konteyner holati ==="
          docker ps --filter name=caddy --format '{{.Names}} | {{.Status}} | {{.Image}}'
          echo
          echo "=== 5) Caddy ichidan /metrics (nginx ni chetlab) ==="
          docker compose -f docker-compose.prod.yml exec -T caddy \
            wget -qS -O /dev/null http://localhost/metrics 2>&1 | head -3 || true
          echo
          echo "=== 6) host-nginx /metrics ni qayerga yuboradi ==="
          grep -rn 'metrics' /etc/nginx/ 2>/dev/null | head -5 || echo "  nginx konfigida 'metrics' yo'q"
          echo
          echo "=== 7) SITE_ADDRESS va caddy bind ==="
          grep -E '^(SITE_ADDRESS|CADDY_HTTP_BIND|CADDY_HTTPS_BIND)=' .env || echo "  .env da yo'q (default)"
          REMOTE
