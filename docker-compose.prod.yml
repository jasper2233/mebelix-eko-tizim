# Konteyner loglari default'da CHEKLANMAGAN — bitta shovqinli xato sikli diskni
# to'ldirib tizimni to'xtatishi mumkin. Repo bilan yuradi, ya'ni yangi o'rnatishda
# ham o'zi qo'llanadi (serverdagi /etc/docker/daemon.json ga tayanmaydi).
x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  db:
    image: postgres:15-alpine
    restart: always
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    logging: *logging
    # Chek navbati (`mes:print:queue:*`) shu yerda yotadi va u YO'QOLMASLIGI kerak:
    # sukutdagi RDB snapshot 60 soniyagacha ish yo'qotardi. Restartda navbatdagi
    # chek yo'qolsa operator "yuborildi" xabarini olgan bo'lib turib qog'oz
    # kutardi; teskarisi ham bo'lardi — eski snapshot tiklanib, chiqib bo'lgan
    # yorliqlar qayta chiqardi. AOF har soniyada yozadi va ikkalasini ham yopadi.
    # `noeviction` — navbat xotira siqilganda O'CHIRILMASIN (chek ma'lumot, kesh emas).
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    # TAG (git sha) bilan teglash rollback uchun: scripts/deploy.sh smoke yiqilsa
    # oxirgi stable TAG'ga qaytaradi. Default latest — lokal qo'lda ishga tushirishga.
    # Image CI'da qurilib ghcr.io ga yuboriladi — serverda build yo'q (deploy.sh pull qiladi).
    # Lokal build kerak bo'lsa docker-compose.local.yml ishlatiladi.
    image: ${REGISTRY:-ghcr.io/dshukriddinov}/mebelix-mes-backend:${TAG:-latest}
    # --forwarded-allow-ips flag sifatida beriladi: FORWARDED_ALLOW_IPS env'ini gunicorn
    # ham o'qiydi va pydantic'ning JSON list formati ('["*"]') uni yiqitadi.
    # Shuning uchun alohida GUNICORN_FORWARDED_ALLOW_IPS (oddiy satr, JSON emas);
    # uni o'zgartirsang .env dagi FORWARDED_ALLOW_IPS ni ham moslashtir.
    # `*` EMAS: u XFF'ning eng chap (mijoz bergan) qiymatini oladi va login
    # rate-limitini header almashtirish bilan aylanib o'tsa bo'lardi. Compose
    # tarmog'i diapazoni berilganda uvicorn o'ngdan chapga yurib Caddy ko'rgan
    # haqiqiy mijoz IP'sini oladi.
    command: bash -c "/app/scripts/prestart.sh && gunicorn app.main:app -w ${GUNICORN_WORKERS:-4} -k uvicorn.workers.UvicornWorker -b 0.0.0.0:8000 --forwarded-allow-ips '${GUNICORN_FORWARDED_ALLOW_IPS:-172.16.0.0/12}'"
    restart: always
    logging: *logging
    expose:
      - "8000"
    volumes:
      # Yuklangan fayllar (.project, SCX, anketa xona rasmlari) konteyner
      # ichida turadi — volumesiz har deploy yangi konteyner bilan o'chib ketardi.
      - uploads_data:/app/backend/uploads
      # CI qurgan agent exe (deploy rsync qo'yadi) — /bridge-agents/latest,/download
      - ./agent-dist:/app/backend/agent-dist:ro
    env_file:
      - .env
    environment:
      POSTGRES_SERVER: db
      REDIS_HOST: redis
      # deploy.sh rollback'i 1 qiladi — eski image yangi sxemada migratsiyasiz ko'tariladi
      SKIP_MIGRATIONS: ${SKIP_MIGRATIONS:-0}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  worker:
    # api bilan bir xil image — alohida build shart emas
    image: ${REGISTRY:-ghcr.io/dshukriddinov}/mebelix-mes-backend:${TAG:-latest}
    command: arq app.core.worker.WorkerSettings
    restart: always
    healthcheck:
      # `arq --check` Redis'dagi worker yozuvini o'qiydi (WorkerSettings da
      # `health_check_interval = 30`). Busiz worker jimgina o'lsa ham konteyner
      # "up" bo'lib turardi: chek chiqarish navbati to'xtaydi, lekin deploy ham,
      # monitoring ham buni ko'rmasdi.
      test: ["CMD", "arq", "app.core.worker.WorkerSettings", "--check"]
      interval: 30s
      timeout: 10s
      retries: 3
      # api bilan bir xil: worker startda DB ulanishini kutadi
      start_period: 40s
    logging: *logging
    env_file:
      - .env
    environment:
      POSTGRES_SERVER: db
      REDIS_HOST: redis
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    # VITE_* build vaqtida bundle'ga kiradi, shuning uchun ular CI'dagi build
    # qadamida beriladi (.github/workflows/ci.yml, images job) — bu yerda emas.
    # SDK yo'llari /api/v1 bilan boshlanadi: bo'sh BASE = same-origin, Caddy orqali.
    image: ${REGISTRY:-ghcr.io/dshukriddinov}/mebelix-mes-frontend:${TAG:-latest}
    restart: always
    logging: *logging
    expose:
      - "80"
    depends_on:
      - api
    # healthcheck image'ning o'zida (frontend/Dockerfile HEALTHCHECK) — bir xil
    # wget testi va interval/timeout/retries; bu yerda takrorlash shart emas.

  caddy:
    image: caddy:2-alpine
    restart: always
    logging: *logging
    ports:
      # Mavjud host-nginx (ISPmanager) ortida ishlaganda: CADDY_HTTP_BIND=127.0.0.1:8200,
      # CADDY_HTTPS_BIND=127.0.0.1:8443 va SITE_ADDRESS=:80 (TLS'ni nginx tugatadi).
      - "${CADDY_HTTP_BIND:-80}:80"
      - "${CADDY_HTTPS_BIND:-443}:443"
    environment:
      # `:80` (default) → plain HTTP. Set `SITE_ADDRESS=your-domain.com` to get auto-HTTPS.
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      # KATALOG mount, fayl EMAS: `rsync` faylni almashtirganda yangi inode
      # yaratadi, fayl-mount esa eskisiga bog'langan qoladi — konteyner eski
      # konfigni ko'rib turaverardi (prodda caddy 3 hafta eski Caddyfile bilan
      # ishlagan va `caddy reload` ham o'sha eskisini qayta yuklardi).
      # Katalog mountda inode o'zgarmaydi, ichidagi fayl esa doim ko'rinadi.
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_started
      api:
        condition: service_healthy
    healthcheck:
      # SITE_ADDRESS domen bo'lganda :80 avto-redirect qiladi — shuning uchun alohida :8080 health blokiga qaraymiz.
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  caddy_data:
  caddy_config:
